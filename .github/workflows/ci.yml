name: macOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Verify (Universal macOS)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build MOpenKey (Universal: arm64 + x86_64)
        run: |
          xcodebuild \
            -project Sources/OpenKey/macOS/OpenKey.xcodeproj \
            -scheme OpenKey \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Strip metadata & Ad-hoc Sign
        run: |
          APP="./build/Build/Products/Release/MOpenKey.app"
          xattr -cr "${APP}"
          codesign --force --deep --sign - "${APP}"

      - name: Verify Architecture and Code Signature
        run: |
          APP="./build/Build/Products/Release/MOpenKey.app"
          echo "Checking binary architectures:"
          file "${APP}/Contents/MacOS/MOpenKey"
          
          echo "Verifying code signature:"
          codesign -dvv "${APP}"

      - name: Package App Bundle
        run: |
          mkdir -p dist
          APP="./build/Build/Products/Release/MOpenKey.app"
          ditto -c -k --keepParent "${APP}" dist/MOpenKey-macOS-Universal.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOpenKey-macOS-Universal
          path: dist/MOpenKey-macOS-Universal.zip
          retention-days: 7
